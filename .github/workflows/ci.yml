name: ShieldScore CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-test:
    name: Contract Compile, ZK Circuits & Tests
    runs-on: ubuntu-latest
    services:
      proof-server:
        image: midnightntwrk/proof-server:latest
        ports:
          - 6300:6300

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: contract/package-lock.json

      - name: Install Compact Compiler Toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.compact/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Compact Installation
        run: |
          export PATH="$HOME/.compact/bin:$HOME/.local/bin:$PATH"
          compact --version || ~/.local/bin/compact --version

      - name: Install Contract Dependencies
        working-directory: contract
        run: npm ci || npm install

      - name: Compile ShieldScore Compact Contract
        working-directory: contract
        run: |
          export PATH="$HOME/.compact/bin:$HOME/.local/bin:$PATH"
          compact compile src/shieldscore.compact managed || ~/.local/bin/compact compile src/shieldscore.compact managed

      - name: Typecheck Contract Code
        working-directory: contract
        run: npx tsc --noEmit

      - name: Run Contract Vitest Suite
        working-directory: contract
        run: npm test

  frontend-build:
    name: Frontend Typecheck, Build & Deployment Staging
    runs-on: ubuntu-latest
    needs: contract-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Typecheck Frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build Frontend Distribution
        working-directory: frontend
        run: npm run build

      - name: Upload Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shieldscore-frontend-dist
          path: frontend/dist
          retention-days: 14
