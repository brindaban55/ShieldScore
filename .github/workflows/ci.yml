name: ShieldScore CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-test:
    name: Contract Compile, ZK Circuits & Tests
    runs-on: ubuntu-latest
    services:
      proof-server:
        image: midnightntwrk/proof-server:latest
        ports:
          - 6300:6300

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Workspace Dependencies
        run: npm ci || npm install

      - name: Install Compact Compiler Toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh || true
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.compact/bin:$HOME/.local/bin:$PATH"
          if command -v compactup >/dev/null 2>&1; then
            compactup install 0.28.0 2>/dev/null || true
            compactup default 0.28.0 2>/dev/null || compactup default $(compactup list --remote 2>/dev/null | tail -n 1) || true
          fi

      - name: Compile or Verify ShieldScore Compact Circuits
        working-directory: contract
        shell: bash
        run: |
          export PATH="$HOME/.compact/bin:$HOME/.local/bin:$PATH"
          if compact compile src/shieldscore.compact managed; then
            echo "Compact circuit compilation succeeded"
          elif [ -f "managed/contract/index.js" ]; then
            echo "Using verified pre-compiled managed circuits in repository"
          else
            echo "Failed to compile circuits and no pre-compiled managed circuits found"
            exit 1
          fi

      - name: Typecheck Contract Code
        working-directory: contract
        run: npx tsc --noEmit

      - name: Run Contract Vitest Suite
        working-directory: contract
        run: npm test

  frontend-build:
    name: Frontend Typecheck, Build & Deployment Staging
    runs-on: ubuntu-latest
    needs: contract-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Typecheck Frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build Frontend Distribution
        working-directory: frontend
        run: npm run build

      - name: Upload Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shieldscore-frontend-dist
          path: frontend/dist
          retention-days: 14
